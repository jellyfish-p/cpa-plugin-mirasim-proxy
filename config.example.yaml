# CLIProxyAPI Plugin Configuration for Mirasim Proxy
# Place this under your CLIProxyAPI config.yaml

plugins:
  enabled: true
  dir: "plugins" # Directory containing mirasim-proxy.dll or mirasim-proxy.so
  configs:
    mirasim-proxy:
      enabled: true
      priority: 1
      # Mirasim Relay / API Gateway URL (default: https://relay.mirasim.ai)
      relay_url: "https://relay.mirasim.ai"
      # Optional: manual token override (can also be configured via OAuth in the WebUI panel)
      # token: "YOUR_MIRASIM_TOKEN"
